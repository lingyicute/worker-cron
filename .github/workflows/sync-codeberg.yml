name: Sync default branches to mirrors (Codeberg / GitLab / Gitea / Framagit / GitGud / Bitbucket / Tangled)

on:
  workflow_dispatch:
    inputs:
      force_push:
        description: >-
          Force push 模式：正常遍历同步；遇到「镜像站分支不是 GitHub 祖先」的仓库时
          打印警告并 force push（用 GitHub 覆盖镜像站）。仅手动触发时有效。
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  # UTC+8 01:00-07:00 不执行（仅 push 等自动触发；手动 workflow_dispatch 不受限制）
  gate:
    name: Check UTC+8 quiet hours
    runs-on: ubuntu-slim
    outputs:
      quiet: ${{ steps.window.outputs.quiet }}
    steps:
      - id: window
        run: |
          hour=$(TZ=Asia/Shanghai date +%-H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && [ "$hour" -ge 1 ] && [ "$hour" -lt 7 ]; then
            quiet=true
          else
            quiet=false
          fi
          echo "UTC+8 当前小时: $hour, quiet=$quiet"
          echo "quiet=$quiet" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync to ${{ matrix.name }}
    needs: gate
    if: ${{ needs.gate.outputs.quiet != 'true' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Codeberg
            kind: gitea
            host: codeberg.org
            owner: lingyicute
            git_user: lingyicute
            token_secret: CODEBERG_TOKEN
          - name: Codefloe
            kind: gitea
            host: codefloe.com
            owner: lingyicute
            git_user: lingyicute
            token_secret: CODEFLOE_TOKEN
          - name: Disroot
            kind: gitea
            host: git.disroot.org
            owner: lingyicute
            git_user: lingyicute
            token_secret: DR_TOKEN
          - name: pub.solar
            kind: gitea
            host: git.pub.solar
            owner: lingyicute
            git_user: lingyicute
            token_secret: PUBSOLAR_TOKEN
          - name: OpenCommit
            kind: gitea
            host: opencommit.eu
            owner: lingyicute
            git_user: lingyicute
            token_secret: OC
          - name: GitLab
            kind: gitlab
            host: gitlab.com
            owner: lingyicute
            git_user: oauth2
            token_secret: GITLAB_TOKEN
          - name: Gitea
            kind: gitea
            host: gitea.com
            owner: lingyicute
            git_user: lingyicute
            token_secret: GITEA_TOKEN
          - name: Framagit
            kind: gitlab
            host: framagit.org
            owner: lingyicute
            git_user: oauth2
            token_secret: FRAMAGIT_TOKEN
          - name: GitGud
            kind: gitlab
            host: gitgud.io
            owner: lingyicute
            git_user: oauth2
            token_secret: GITGUD_TOKEN
          - name: git.gay
            kind: gitea
            host: git.gay
            owner: lingyicute
            git_user: lingyicute
            token_secret: GAY
          - name: Bitbucket
            kind: bitbucket
            host: bitbucket.org
            owner: lingyicute
            git_user: x-bitbucket-api-token-auth
            token_secret: BITBUCKET_TOKEN
          - name: Tangled
            kind: tangled
            host: tangled.org
            owner: lingyicute.tngl.sh
            git_user: git
            token_secret: TANGLED_SSH_KEY

    steps:
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_NAME: ${{ matrix.name }}
          TARGET_KIND: ${{ matrix.kind }}
          TARGET_HOST: ${{ matrix.host }}
          TARGET_OWNER: ${{ matrix.owner }}
          TARGET_GIT_USER: ${{ matrix.git_user }}
          TARGET_TOKEN: ${{ secrets[matrix.token_secret] }}
          TOKEN_SECRET_NAME: ${{ matrix.token_secret }}
          # 仅手动触发且勾选 force_push 时为 true；push / 定时等触发一律为 false
          FORCE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_push == true }}
        run: |
          # ------------------------------------------------------------------
          #  2026.11.17
          #   1. GitHub 侧：用 1 次 GraphQL（分页）一次性拿到所有仓库的
          #      「名称 / 默认分支 / HEAD sha」，不再逐仓库 git fetch 来取 sha。
          #   2. 目标站：用 1 次分页列表 API 取代逐仓库 GET（404 探测 + 默认分支），
          #      列表里没有的仓库直接跳过。
          #   3. 目标站分支 sha：对已存在的仓库只做 1 次 git ls-remote
          #   4. sha 与 GitHub 相同 → 直接跳过，不 fetch、不 push（常态下绝大多数仓库）
          #   5. 只有 sha 不同才 fetch GitHub，并且「祖先检查」直接用本地对象完成，
          #      不再 fetch 目标站；目标 sha 若不在 GitHub 历史里即视为非追加。
          #   6. 所有网络请求带指数退避重试，请求之间少量间隔；单个仓库出错不会中断其余
          #      仓库，最后统一报错。
          #   7. Force push 模式（仅 workflow_dispatch 且勾选 force_push）：流程不变，
          #      只有在发现「镜像站分支不是 GitHub 祖先」的仓库时，才打印警告并
          #      用 --force-with-lease（锁定刚才 ls-remote 到的 sha）强推；其余仓库
          #      仍走普通 push。
          # ------------------------------------------------------------------
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          OWNER=lingyicute
          REQUEST_DELAY=0.5     # 对目标站连续请求之间的间隔（秒）
          MAX_ATTEMPTS=5

          if [ -z "$TARGET_TOKEN" ]; then
            echo "::error::Secret $TOKEN_SECRET_NAME is not set (needed for $TARGET_NAME)"
            exit 1
          fi

          # 通用重试：指数退避 15s / 30s / 60s / 120s
          retry() {
            local n=1 delay=15
            until "$@"; do
              if [ "$n" -ge "$MAX_ATTEMPTS" ]; then
                return 1
              fi
              echo "  attempt $n failed, retrying in ${delay}s: $1 $2" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          # Tangled：准备 SSH 私钥
          if [ "$TARGET_KIND" = tangled ]; then
            if ! command -v ssh >/dev/null 2>&1 || ! command -v ssh-keygen >/dev/null 2>&1; then
              SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO=sudo
              $SUDO apt-get update -qq && $SUDO apt-get install -y -qq openssh-client
            fi
            ssh_dir="$RUNNER_TEMP/tangled-ssh"
            mkdir -p "$ssh_dir"
            chmod 700 "$ssh_dir"
            # 去掉可能混入的 CR，并保证以换行结尾（否则 OpenSSH 会报 invalid format）
            printf '%s\n' "$TARGET_TOKEN" | tr -d '\r' > "$ssh_dir/id"
            chmod 600 "$ssh_dir/id"
            if ! ssh-keygen -y -f "$ssh_dir/id" >/dev/null 2>&1; then
              echo "::error::$TOKEN_SECRET_NAME is not a valid unencrypted SSH private key"
              exit 1
            fi
            export GIT_SSH_COMMAND="ssh -i $ssh_dir/id -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$ssh_dir/known_hosts -o ConnectTimeout=30 -o ServerAliveInterval=15"
          fi

          # 带 429/5xx 处理的 API GET：成功时把响应体输出到 stdout
          if [ "$TARGET_KIND" = gitlab ]; then
            auth_header="PRIVATE-TOKEN: $TARGET_TOKEN"
          elif [ "$TARGET_KIND" = tangled ]; then
            auth_header=""   # Tangled 用 SSH 私钥，不走 HTTP token
          else
            auth_header="Authorization: token $TARGET_TOKEN"
          fi
          api_get() {
            local url=$1 n=1 code wait
            local body="$RUNNER_TEMP/api.body" hdr="$RUNNER_TEMP/api.hdr"
            while :; do
              code=$(curl -sS -o "$body" -D "$hdr" -w '%{http_code}' \
                -H "$auth_header" "$url") || code=000
              if [ "$code" = 200 ]; then
                cat "$body"
                return 0
              fi
              if { [ "$code" = 429 ] || [ "$code" -ge 500 ] || [ "$code" = 000 ]; } \
                 && [ "$n" -lt "$MAX_ATTEMPTS" ]; then
                wait=$(awk -F': ' 'tolower($1)=="retry-after"{gsub(/\r/,"",$2); print $2}' "$hdr" | tail -n1)
                case "$wait" in ''|*[!0-9]*) wait=$((15 * 2 ** (n - 1)));; esac
                [ "$wait" -gt 300 ] && wait=300
                echo "  HTTP $code from $TARGET_NAME API, retrying in ${wait}s" >&2
                sleep "$wait"
                n=$((n + 1))
                continue
              fi
              echo "  HTTP $code from $TARGET_NAME API: $url" >&2
              return 1
            done
          }

          api_get_noauth() {
            local url=$1 n=1 code wait
            local body="$RUNNER_TEMP/api.body" hdr="$RUNNER_TEMP/api.hdr"
            while :; do
              code=$(curl -sS -o "$body" -D "$hdr" -w '%{http_code}' \
                 "$url") || code=000
              if [ "$code" = 200 ]; then
                cat "$body"
                return 0
              fi
              if { [ "$code" = 429 ] || [ "$code" -ge 500 ] || [ "$code" = 000 ]; } \
                 && [ "$n" -lt "$MAX_ATTEMPTS" ]; then
                wait=$(awk -F': ' 'tolower($1)=="retry-after"{gsub(/\r/,"",$2); print $2}' "$hdr" | tail -n1)
                case "$wait" in ''|*[!0-9]*) wait=$((15 * 2 ** (n - 1)));; esac
                [ "$wait" -gt 300 ] && wait=300
                echo "  HTTP $code from $TARGET_NAME API, retrying in ${wait}s" >&2
                sleep "$wait"
                n=$((n + 1))
                continue
              fi
              echo "  HTTP $code from $TARGET_NAME API: $url" >&2
              return 1
            done
          }

          # GitLab 系（GitLab / Framagit / GitGud）默认分支被设为 protected，禁止 force push。
          # force push 前先取消该分支的保护（DELETE protected_branches）。
          #   204 / 200 → 已解除保护；404 → 本来就没有保护，同样视为成功。
          # 单次尝试，外层用 retry 做退避重试（429 / 5xx / 网络错误会返回非 0）。
          unprotect_branch() {
            local pid=$1 branch=$2 enc code
            enc=$(jq -rn --arg b "$branch" '$b|@uri')
            code=$(curl -sS -o "$RUNNER_TEMP/unprotect.body" -w '%{http_code}' \
              -X DELETE -H "$auth_header" \
              "https://$TARGET_HOST/api/v4/projects/$pid/protected_branches/$enc") || code=000
            case "$code" in
              200|204|404) return 0 ;;
            esac
            echo "  HTTP $code unprotecting $branch (project $pid) on $TARGET_NAME: $(head -c 300 "$RUNNER_TEMP/unprotect.body" 2>/dev/null)" >&2
            return 1
          }

          # ---- 1. GitHub：一次性拿到 name / 默认分支 / HEAD sha ----------------
          gh_repos=$(retry gh api graphql --paginate \
            -f owner="$OWNER" \
            -f query='
              query($owner: String!, $endCursor: String) {
                repositoryOwner(login: $owner) {
                  repositories(first: 100, after: $endCursor, privacy: PUBLIC, ownerAffiliations: OWNER) {
                    nodes { name defaultBranchRef { name target { oid } } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }' \
            --jq '.data.repositoryOwner.repositories.nodes[]
                  | select(.defaultBranchRef != null)
                  | "\(.name) \(.defaultBranchRef.name) \(.defaultBranchRef.target.oid)"')

          # ---- 2a. Tangled：handle -> DID -> PDS ----
          tangled_did=""
          tangled_pds=""
          if [ "$TARGET_KIND" = tangled ]; then
            tangled_did=$(api_get_noauth "https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=$TARGET_OWNER" | jq -r '.did // empty') || tangled_did=""
            if [ -z "$tangled_did" ]; then
              tangled_did=$(api_get_noauth "https://$TARGET_OWNER/.well-known/atproto-did" | tr -d '[:space:]') || tangled_did=""
            fi
            case "$tangled_did" in
              did:plc:*) did_doc_url="https://plc.directory/$tangled_did" ;;
              did:web:*) did_doc_url="https://${tangled_did#did:web:}/.well-known/did.json" ;;
              *) echo "::error::Cannot resolve Tangled handle $TARGET_OWNER to a DID"; exit 1 ;;
            esac
            tangled_pds=$(api_get_noauth "$did_doc_url" \
              | jq -r '.service[] | select(.type=="AtprotoPersonalDataServer") | .serviceEndpoint' | head -n1) || tangled_pds=""
            if [ -z "$tangled_pds" ]; then
              echo "::error::Cannot find PDS for $tangled_did"
              exit 1
            fi
            echo "Tangled: $TARGET_OWNER -> $tangled_did (PDS: $tangled_pds)"
          fi

          # ---- 2. 目标站：分页列出已有仓库（name 默认分支） --------------------
          target_repos=""
          cursor=""
          target_ids=""   # 仅 GitLab 系："path 项目id"，force push 前解锁默认分支要用
          page=1
          next_url=""
          while :; do
            if [ "$TARGET_KIND" = gitlab ]; then
              url="https://$TARGET_HOST/api/v4/users/$TARGET_OWNER/projects?per_page=100&page=$page"
              filter='.[] | "\(.path) \(.default_branch // "")"'
            elif [ "$TARGET_KIND" = bitbucket ]; then
              url="${next_url:-https://api.bitbucket.org/2.0/repositories/$TARGET_OWNER?pagelen=100}"
              filter='.values[] | "\(.slug) \(.mainbranch.name // "")"'
            elif [ "$TARGET_KIND" = tangled ]; then
              # 每个仓库对应用户 PDS 里一条 org.tangled.repo.declaration，rkey 即（小写的）仓库名；
              # 默认分支这里拿不到，留空，稍后用 git ls-remote --symref 获取
              url="$tangled_pds/xrpc/com.atproto.repo.listRecords?repo=$tangled_did&collection=org.tangled.repo.declaration&limit=100${cursor:+&cursor=$cursor}"
              # Tangled 仓库名一律小写：这里再 ascii_downcase 一次，保证与 tname 比较时大小写一致
              filter='.records[] | "\(.uri | sub(".*/"; "") | ascii_downcase) "'
            else
              url="https://$TARGET_HOST/api/v1/users/$TARGET_OWNER/repos?limit=50&page=$page"
              filter='.[] | "\(.name) \(.default_branch // "")"'
            fi
            resp=$(api_get_noauth "$url") || { echo "::error::Failed to list repos on $TARGET_NAME"; exit 1; }
            lines=$(jq -r "$filter" <<< "$resp")
            [ -z "$lines" ] && break
            target_repos+="$lines"$'\n'
            if [ "$TARGET_KIND" = gitlab ]; then
              target_ids+="$(jq -r '.[] | "\(.path) \(.id)"' <<< "$resp")"$'\n'
            fi
            if [ "$TARGET_KIND" = bitbucket ]; then
              next_url=$(jq -r '.next // empty' <<< "$resp")
              [ -z "$next_url" ] && break
            fi
            if [ "$TARGET_KIND" = tangled ]; then
              cursor=$(jq -r '.cursor // empty' <<< "$resp")
              [ -z "$cursor" ] && break
            fi
            page=$((page + 1))
            sleep "$REQUEST_DELAY"
          done
          echo "GitHub: $(grep -c . <<< "$gh_repos") repos, $TARGET_NAME: $(grep -c . <<< "$target_repos") repos"

          git init -q --bare "$RUNNER_TEMP/sync.git"
          cd "$RUNNER_TEMP/sync.git"

          failed=0
          synced=0
          uptodate=0
          skipped=0
          forced=0
          forced_list=""

          if [ "$FORCE_PUSH" = true ]; then
            echo "::warning title=Force push mode ON ($TARGET_NAME)::Force push 模式已开启：发现非追加（non-fast-forward）的仓库时将强制覆盖 $TARGET_NAME 上的默认分支"
            echo "Force push mode: ON  (target: $TARGET_NAME)"
          else
            echo "Force push mode: off"
          fi

          while read -r name gh_branch gh_sha <&3; do
            [ -z "$name" ] && continue

            # 目标站上的仓库名：Bitbucket 的 slug、Tangled 的仓库名（rkey）全部小写，
            # 其余站点与 GitHub 同名
            tname=$name
            if [ "$TARGET_KIND" = bitbucket ] || [ "$TARGET_KIND" = tangled ]; then
              tname=${name,,}
            fi
            if [ "$TARGET_KIND" = gitea ] && [ "$name" = "$OWNER" ]; then
              if [ "$(awk -v n=".profile" '$1==n{c++} END{print c+0}' <<< "$target_repos")" != 0 ]; then
                tname=.profile
                echo "map $name -> $tname on $TARGET_NAME (.profile is treated as $OWNER)"
              fi
            fi

            # 目标站上没同名仓库：跳过
            if [ "$(awk -v n="$tname" '$1==n{c++} END{print c+0}' <<< "$target_repos")" = 0 ]; then
              echo "skip $name (not on $TARGET_NAME)"
              skipped=$((skipped + 1))
              continue
            fi

            target_branch=$(awk -v n="$tname" '$1==n{print $2; exit}' <<< "$target_repos")
            target_pid=""
            if [ "$TARGET_KIND" = gitlab ]; then
              target_pid=$(awk -v n="$tname" '$1==n{print $2; exit}' <<< "$target_ids")
            fi

            # 目标站是空仓库时 default_branch 可能为空，此时不做分支名比较
            if [ -n "$target_branch" ] && [ "$target_branch" != "$gh_branch" ]; then
              echo "::error::$name: default branch differs (GitHub: $gh_branch, $TARGET_NAME: $target_branch)"
              failed=$((failed + 1))
              continue
            fi

            if [ "$TARGET_KIND" = tangled ]; then
              # SSH 认证（见上面的 GIT_SSH_COMMAND），URL 中不含任何凭据
              target_url="$TARGET_GIT_USER@$TARGET_HOST:$TARGET_OWNER/$tname"
            else
              target_url="https://$TARGET_GIT_USER:$TARGET_TOKEN@$TARGET_HOST/$TARGET_OWNER/$tname.git"
            fi

            # ---- 3. 只问目标站这一个分支的 sha（git ls-remote） ----
            if [ "$TARGET_KIND" = tangled ]; then
              # 同一次 ls-remote 里顺带取 HEAD 的 symref（= Tangled 上的默认分支）
              if ! ls=$(retry git ls-remote --symref "$target_url" HEAD "refs/heads/$gh_branch" 2>"$RUNNER_TEMP/lsremote.err"); then
                echo "::error::$name: git ls-remote on $TARGET_NAME failed: $(head -c 300 "$RUNNER_TEMP/lsremote.err")"
                failed=$((failed + 1))
                continue
              fi
              target_branch=$(awk '$1=="ref:"{sub("^refs/heads/","",$2); print $2; exit}' <<< "$ls")
              target_sha=$(awk -v r="refs/heads/$gh_branch" '$1!="ref:" && $2==r{print $1; exit}' <<< "$ls")
              if [ -n "$target_branch" ] && [ "$target_branch" != "$gh_branch" ]; then
                echo "::error::$name: default branch differs (GitHub: $gh_branch, $TARGET_NAME: $target_branch)"
                failed=$((failed + 1))
                continue
              fi
            else
              if ! ls=$(retry git ls-remote "$target_url" "refs/heads/$gh_branch" 2>/dev/null); then
                echo "::error::$name: git ls-remote on $TARGET_NAME failed"
                failed=$((failed + 1))
                continue
              fi
              target_sha=$(awk '{print $1; exit}' <<< "$ls")
            fi
            sleep "$REQUEST_DELAY"

            # ---- 4. 已经一致：nothing to do ----
            if [ "$target_sha" = "$gh_sha" ]; then
              echo "up-to-date $name ($gh_branch)"
              uptodate=$((uptodate + 1))
              continue
            fi

            # ---- 5. 需要同步：从 GitHub 取对象，本地做祖先检查，再 push ----
            gh_url="https://github.com/$OWNER/$name.git"
            if ! retry git fetch -q --no-tags "$gh_url" "$gh_branch"; then
              echo "::error::$name: git fetch from GitHub failed"
              failed=$((failed + 1))
              continue
            fi
            fetched_sha=$(git rev-parse FETCH_HEAD)
            if [ "$fetched_sha" != "$gh_sha" ]; then
              # GraphQL 与 fetch 之间 GitHub 又有新提交：以实际 fetch 到的为准
              gh_sha=$fetched_sha
            fi

            # 镜像站提交必须是 GitHub 的祖先，否则就不是单纯追加 commit：
            #   - 普通模式：报错并跳过
            #   - force push 模式：打印警告，然后 force push
            # （目标 sha 不在 GitHub 历史中时，对象不存在，同样视为非祖先）
            need_force=0
            if [ -n "$target_sha" ]; then
              if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null \
                 || ! git merge-base --is-ancestor "$target_sha" "$gh_sha"; then
                if [ "$FORCE_PUSH" = true ]; then
                  need_force=1
                  echo "::warning title=FORCE PUSH $TARGET_NAME/$name::$name: $TARGET_NAME/$gh_branch ($target_sha) is not an ancestor of GitHub/$gh_branch -> FORCE PUSHING"
                  {
                    echo ""
                    echo ""
                    echo ""
                    echo ""
                    echo ""
                    echo ""
                    echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                    echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                    echo "!!!!!!!!!!!!!!!!!!!!!!"
                    echo "!!!!!!!!!!!!!!!!!!!!!!  WARNING: FORCE PUSH  ->  $TARGET_NAME/$TARGET_OWNER/$name ($gh_branch)"
                    echo "!!!!!!!!!!!!!!!!!!!!!!  $TARGET_NAME 上的分支不是 GitHub 的祖先（非追加），将实施强制覆盖！"
                    echo "!!!!!!!!!!!!!!!!!!!!!!    old ($TARGET_NAME): $target_sha"
                    echo "!!!!!!!!!!!!!!!!!!!!!!    new (GitHub)      : $gh_sha"
                    echo "!!!!!!!!!!!!!!!!!!!!!!"
                    echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                    echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                    echo ""
                    echo ""
                    echo ""
                    echo ""
                    echo ""
                    echo ""
                  } >&2
                else
                  echo "::error::$name: $TARGET_NAME/$gh_branch ($target_sha) is not an ancestor of GitHub/$gh_branch (not append-only; re-run with force_push to overwrite)"
                  failed=$((failed + 1))
                  continue
                fi
              fi
            fi

            if [ "$need_force" = 1 ] && [ "$TARGET_KIND" = gitlab ]; then
              # GitLab 系：默认分支被锁定（protected），force push 前先解锁
              if [ -z "$target_pid" ]; then
                echo "::error::$name: cannot unprotect $gh_branch on $TARGET_NAME (project id unknown)"
                failed=$((failed + 1))
                continue
              fi
              echo "unprotecting $TARGET_NAME/$name ($gh_branch, project id $target_pid) before force push"
              if ! retry unprotect_branch "$target_pid" "$gh_branch"; then
                echo "::error::$name: failed to unprotect $gh_branch on $TARGET_NAME (token 需要 api 权限且为 Maintainer/Owner)"
                failed=$((failed + 1))
                continue
              fi
              sleep "$REQUEST_DELAY"
            fi

            if [ "$need_force" = 1 ]; then
              # --force-with-lease 显式锁定期望的旧 sha：若镜像站在此期间又有改动则拒绝覆盖
              if retry git push -q --force-with-lease="refs/heads/$gh_branch:$target_sha" \
                   "$target_url" "$gh_sha:refs/heads/$gh_branch"; then
                echo "::warning title=FORCE PUSHED $TARGET_NAME/$name::$name: force pushed $gh_branch ($target_sha -> $gh_sha)"
                echo "FORCE-PUSHED $name ($gh_branch) -> $TARGET_NAME  [$target_sha -> $gh_sha]"
                forced=$((forced + 1))
                forced_list+="$name ($target_sha -> $gh_sha)"$'\n'
              else
                echo "::error::$name: force push to $TARGET_NAME failed (分支保护是否禁止了 force push？)"
                failed=$((failed + 1))
              fi
            # 普通 push，不加 --force
            elif retry git push -q "$target_url" "$gh_sha:refs/heads/$gh_branch"; then
              echo "synced $name ($gh_branch) -> $TARGET_NAME"
              synced=$((synced + 1))
            else
              echo "::error::$name: git push to $TARGET_NAME failed"
              failed=$((failed + 1))
            fi
            sleep "$REQUEST_DELAY"
          done 3<<< "$gh_repos"

          echo "Summary [$TARGET_NAME]: synced=$synced forced=$forced up-to-date=$uptodate skipped=$skipped failed=$failed"
          {
            echo "### $TARGET_NAME Synced ($synced) Forced ($forced) Up to date ($uptodate) Skipped ($skipped) Failed ($failed)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$forced" -gt 0 ]; then
            echo "::warning title=Force pushed repos on $TARGET_NAME::$forced 个仓库被 force push，详见日志与 Job Summary"
            {
              echo "### :warning: Force pushed on $TARGET_NAME ($forced)"
              echo '```'
              printf '%s' "$forced_list"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

  sync-huggingface:
    name: Sync repoPackage tarball to Hugging Face
    needs: gate
    if: ${{ needs.gate.outputs.quiet != 'true' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - name: Sync repoPackage tarball via Git LFS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          OWNER=lingyicute
          REPO=repoPackage
          HF_OWNER=lingyicute
          HF_SPACE=repoPackage
          HF_USER=lingyicute
          TARBALL_NAME="repoPackage.tar.gz"
          MAX_ATTEMPTS=5

          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN is not set (needed for Hugging Face)"
            exit 1
          fi

          # 通用重试：指数退避 15s / 30s / 60s / 120s
          retry() {
            local n=1 delay=15
            until "$@"; do
              if [ "$n" -ge "$MAX_ATTEMPTS" ]; then
                return 1
              fi
              echo "  attempt $n failed, retrying in ${delay}s: $1 $2" >&2
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          # 1. 获取 GitHub 上 repoPackage 的默认分支与最新 commit sha
          gh_branch=$(retry gh api "repos/$OWNER/$REPO" --jq '.default_branch')
          gh_sha=$(retry gh api "repos/$OWNER/$REPO/commits/$gh_branch" --jq '.sha')
          echo "GitHub $OWNER/$REPO: branch=$gh_branch, sha=$gh_sha"

          # 2. 克隆 Hugging Face Space（跳过 LFS 对象拉取，仅检出指针与普通文件）
          hf_url="https://$HF_USER:$HF_TOKEN@huggingface.co/datasets/$HF_OWNER/$HF_SPACE.git"
          work_dir="$RUNNER_TEMP/hf-repoPackage"
          rm -rf "$work_dir"
          GIT_LFS_SKIP_SMUDGE=1 retry git clone -q --depth=20 "$hf_url" "$work_dir"
          cd "$work_dir"

          # 3. 若上次针对该 tarball 的提交已是同一个 GitHub commit sha，直接跳过下载
          if [ -f "$TARBALL_NAME" ] \
             && git log -n 1 --pretty=%B -- "$TARBALL_NAME" | grep -qF "$gh_sha"; then
            echo "up-to-date $REPO ($gh_sha) on Hugging Face"
            exit 0
          fi

          # 4. 下载 repoPackage 的 tarball
          tarball_tmp="$RUNNER_TEMP/$TARBALL_NAME"
          download_tarball() {
            curl -fL --connect-timeout 30 --max-time 600 \
              -H "Accept: application/vnd.github+json" \
              ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
              "https://api.github.com/repos/$OWNER/$REPO/tarball/$gh_sha" \
              -o "$tarball_tmp.part" \
              && [ -s "$tarball_tmp.part" ] \
              && mv -f "$tarball_tmp.part" "$tarball_tmp"
          }
          echo "Downloading tarball for $OWNER/$REPO ($gh_sha)..."
          retry download_tarball

          # 5. 使用 Git LFS 追踪并提交推送到 HF
          git lfs install --local
          git lfs track "*.tar.gz"
          mv -f "$tarball_tmp" "./$TARBALL_NAME"

          git config user.name "lingyicute"
          git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add .gitattributes "$TARBALL_NAME"

          if git diff --cached --quiet; then
            echo "up-to-date $REPO ($gh_sha) on Hugging Face (no content diff)"
            exit 0
          fi

          git commit -q -m "chore: sync $REPO tarball ($gh_sha)"
          retry git push -q origin HEAD
          echo "synced $TARBALL_NAME ($gh_sha) -> Hugging Face ($HF_OWNER/$HF_SPACE)"
